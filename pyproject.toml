[project]
name = "securetinyml"
version = "0.1.0"
description = "Attacking and defending quantized image models: adversarial patches, FGSM/PGD, backdoors and cheap defenses"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["securetinyml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
