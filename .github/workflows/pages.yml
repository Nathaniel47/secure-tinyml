name: pages
# Manual only: nothing is published until you enable Pages (Settings > Pages > Source:
# GitHub Actions) and run this workflow yourself. See DEPLOY.md.
on: workflow_dispatch

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python deploy/build.py site out/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/site
      - id: deployment
        uses: actions/deploy-pages@v4
